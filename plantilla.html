<title>Psicotécnicos del día</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Una sola columna tipo cuadernillo de examen: cabecera, barra de progreso, pregunta, opciones y explicación. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #12161c; --muted: #5a6472; --line: #dde2ea;
  --accent: #2f4bff; --accent-ink: #ffffff; --ok: #17794a; --ok-bg: #e3f4ea; --bad: #b3261e; --bad-bg: #fbe7e5;
  --warn: #a8660a; --img-bg: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #161a21; --ink: #eceff4; --muted: #9aa4b2; --line: #2a313c;
  --accent: #8ea2ff; --accent-ink: #0e1116; --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1a18;
  --warn: #f0b429; --img-bg: #ffffff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #eceff4; --muted: #9aa4b2; --line: #2a313c;
  --accent: #8ea2ff; --accent-ink: #0e1116; --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1a18;
  --warn: #f0b429; --img-bg: #ffffff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); margin: 0;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 7vw, 44px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 600; }
.cab { display: flex; flex-direction: column; gap: 6px; }
.fecha { font: 500 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 16px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px 18px; cursor: pointer; min-height: 46px; }
.btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .op:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.tipos li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.tipos b { font-family: var(--mono); font-weight: 700; }
.muted { color: var(--muted); font-size: 14px; }
label.sw { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.prog { display: flex; gap: 3px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.prog i.act { background: var(--accent); } .prog i.ok { background: var(--ok); } .prog i.mal { background: var(--bad); } .prog i.nada { background: var(--warn); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.chip { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink); }
.reloj { display: flex; align-items: center; gap: 12px; }
.reloj .seg { font: 700 28px var(--mono); font-variant-numeric: tabular-nums; min-width: 2.6ch; }
.barra { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barra div { height: 100%; background: var(--accent); transform-origin: left; }
.barra.poco div { background: var(--warn); }
.enun { white-space: pre-line; font-size: 18px; line-height: 1.45; margin: 0; }
.destacado { font: 700 clamp(20px, 5.4vw, 30px) var(--mono); letter-spacing: .04em; padding: 14px 16px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); overflow-wrap: anywhere; }
.img { background: var(--img-bg); border-radius: 10px; border: 1px solid var(--line); padding: 6px; }
.img img { display: block; width: 100%; height: auto; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ops.letras { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 520px) { .ops:not(.letras) { grid-template-columns: 1fr; } }
.op { display: flex; gap: 10px; align-items: center; text-align: left; font: 500 17px var(--body); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px; cursor: pointer; min-height: 54px; min-width: 0; overflow-wrap: anywhere; }
.letras .op { justify-content: center; font: 700 22px var(--mono); }
.op .k { font: 700 13px var(--mono); width: 26px; height: 26px; border-radius: 6px; background: var(--bg); display: grid; place-items: center; flex: none; color: var(--muted); }
.op:hover:not(:disabled) { border-color: var(--accent); }
.op:disabled { cursor: default; }
.op.ok { border-color: var(--ok); background: var(--ok-bg); } .op.mal { border-color: var(--bad); background: var(--bad-bg); }
.fb { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); border: 1px solid var(--line); }
.fb strong { font-family: var(--display); font-size: 18px; }
.fb.ok strong { color: var(--ok); } .fb.mal strong { color: var(--bad); } .fb.nada strong { color: var(--warn); }
.truco { margin: 0; font-size: 15px; }
.res-num { font: 800 clamp(48px, 14vw, 80px)/1 var(--display); }
table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tabla { overflow-x: auto; }
.rep { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.rep:first-of-type { border-top: 0; padding-top: 0; }
.resp { font-size: 15px; } .resp b { color: var(--ok); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header class="cab">
    <span class="fecha" id="fecha"></span>
    <h1>Psicotécnicos del día</h1>
  </header>

  <section id="inicio" class="card">
    <p class="muted" style="margin:0" id="resumen"></p>
    <ul class="tipos" id="tipos"></ul>
    <label class="sw" for="crono"><input type="checkbox" id="crono" checked> Con cronómetro (20 s por ejercicio, 30 s en figuras)</label>
    <div class="fila">
      <button class="btn primario" id="empezar">Empezar</button>
      <button class="btn" id="repasar">Ver soluciones</button>
    </div>
    <p class="muted" style="margin:0" id="ultima" hidden></p>
  </section>

  <section id="examen" hidden>
    <div class="card">
      <div class="prog" id="prog"></div>
      <div class="meta"><span class="chip" id="tipo"></span><span id="cuenta"></span></div>
      <div class="reloj" id="reloj"><span class="seg" id="seg">20</span><div class="barra" id="barra"><div id="barra-i"></div></div></div>
      <p class="enun" id="enun"></p>
      <div class="destacado" id="dest" hidden></div>
      <div class="img" id="img" hidden><img id="imgsrc" alt="Ejercicio con figura desplegable"></div>
      <div class="ops" id="ops"></div>
      <div class="fb" id="fb" hidden><strong id="fb-t"></strong><p class="truco" id="fb-x"></p></div>
      <div class="fila"><button class="btn primario" id="sig" hidden>Siguiente</button></div>
    </div>
  </section>

  <section id="resultados" class="card" hidden>
    <h2>Resultado</h2>
    <div class="res-num" id="res-num"></div>
    <p class="muted" style="margin:0" id="res-det"></p>
    <div class="tabla"><table><thead><tr><th>Tipo</th><th>Aciertos</th><th>Tiempo medio</th></tr></thead><tbody id="res-tabla"></tbody></table></div>
    <div id="fallos"></div>
    <div class="fila"><button class="btn primario" id="otra">Repetir</button><button class="btn" id="ver">Ver todas las soluciones</button></div>
  </section>

  <section id="repaso" class="card" hidden>
    <h2>Soluciones</h2>
    <div id="lista"></div>
    <div class="fila"><button class="btn" id="volver">Volver</button></div>
  </section>
</main>

<script>
const DATOS = __DATOS__;
const $ = id => document.getElementById(id);
const L = "ABCD";
const vistas = ["inicio", "examen", "resultados", "repaso"];
const ver = v => vistas.forEach(x => { $(x).hidden = x !== v; });
let est = null, timer = null;

$("fecha").textContent = DATOS.fecha + " · " + DATOS.ejercicios.length + " ejercicios";
const conteo = {};
DATOS.ejercicios.forEach(e => conteo[e.tipo] = (conteo[e.tipo] || 0) + 1);
$("resumen").textContent = "Cada ejercicio se resuelve en menos de 20 segundos si ves el truco. Hoy hay:";
$("tipos").innerHTML = Object.entries(conteo).map(([t, n]) => `<li><span>${t}</span><b>${n}</b></li>`).join("");
try { const u = JSON.parse(localStorage.getItem("psico-" + DATOS.fecha) || "null");
  if (u) { $("ultima").hidden = false; $("ultima").textContent = `Tu último intento de hoy: ${u.ok} de ${u.n}.`; } } catch (e) {}

function opcionesHTML(e) {
  const letras = !!e.imagen;
  $("ops").className = "ops" + (letras ? " letras" : "");
  $("ops").innerHTML = e.opciones.map((o, i) =>
    `<button class="op" data-i="${i}" id="op${i}">${letras ? "" : `<span class="k">${L[i]}</span>`}<span>${o.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span></button>`).join("");
  [...$("ops").children].forEach(b => b.onclick = () => responder(+b.dataset.i));
}

function empezar() {
  est = { i: 0, res: [], crono: $("crono").checked };
  ver("examen"); mostrar();
}

function mostrar() {
  const e = DATOS.ejercicios[est.i], n = DATOS.ejercicios.length;
  $("prog").innerHTML = DATOS.ejercicios.map((_, k) => `<i class="${k < est.res.length ? est.res[k].estado : k === est.i ? "act" : ""}"></i>`).join("");
  $("tipo").textContent = e.tipo; $("cuenta").textContent = `${est.i + 1} / ${n}`;
  $("enun").textContent = e.enunciado;
  $("dest").hidden = !e.destacado; $("dest").textContent = e.destacado || "";
  $("img").hidden = !e.imagen; if (e.imagen) $("imgsrc").src = e.imagen;
  opcionesHTML(e);
  $("fb").hidden = true; $("sig").hidden = true;
  $("reloj").hidden = !est.crono;
  est.t0 = performance.now(); est.limite = e.tiempo * 1000; est.abierta = true;
  clearInterval(timer);
  if (est.crono) { pintarReloj(); timer = setInterval(() => { pintarReloj(); if (performance.now() - est.t0 >= est.limite) responder(-1); }, 100); }
  window.scrollTo({ top: 0 });
}

function pintarReloj() {
  const resta = Math.max(0, est.limite - (performance.now() - est.t0));
  $("seg").textContent = Math.ceil(resta / 1000);
  $("barra-i").style.transform = `scaleX(${resta / est.limite})`;
  $("barra").classList.toggle("poco", resta < 5000);
}

function responder(i) {
  if (!est.abierta) return; est.abierta = false; clearInterval(timer);
  const e = DATOS.ejercicios[est.i], t = (performance.now() - est.t0) / 1000;
  const estado = i < 0 ? "nada" : i === e.correcta ? "ok" : "mal";
  est.res.push({ estado, t: Math.min(t, e.tiempo), resp: i });
  [...$("ops").children].forEach((b, k) => { b.disabled = true; if (k === e.correcta) b.classList.add("ok"); else if (k === i) b.classList.add("mal"); });
  $("fb").hidden = false; $("fb").className = "fb " + estado;
  $("fb-t").textContent = estado === "ok" ? `Correcto · ${t.toFixed(1).replace(".", ",")} s` : estado === "mal" ? `Incorrecto · era la ${L[e.correcta]}` : `Se acabó el tiempo · era la ${L[e.correcta]}`;
  $("fb-x").textContent = e.truco;
  $("sig").hidden = false; $("sig").textContent = est.i + 1 < DATOS.ejercicios.length ? "Siguiente" : "Ver resultado"; $("sig").focus();
}

function siguiente() {
  if (est.i + 1 < DATOS.ejercicios.length) { est.i++; mostrar(); } else resultados();
}

const seg = x => x.toFixed(1).replace(".", ",") + " s";
function resultados() {
  const ej = DATOS.ejercicios, ok = est.res.filter(r => r.estado === "ok").length, n = ej.length;
  try { localStorage.setItem("psico-" + DATOS.fecha, JSON.stringify({ ok, n })); } catch (e) {}
  ver("resultados");
  $("res-num").textContent = `${ok} / ${n}`;
  $("res-det").textContent = `Tiempo medio: ${seg(est.res.reduce((a, r) => a + r.t, 0) / n)}${est.crono ? "" : " (sin cronómetro)"}.`;
  const por = {};
  ej.forEach((e, k) => { const p = por[e.tipo] = por[e.tipo] || { n: 0, ok: 0, t: 0 }; p.n++; p.t += est.res[k].t; if (est.res[k].estado === "ok") p.ok++; });
  $("res-tabla").innerHTML = Object.entries(por).map(([t, p]) => `<tr><td>${t}</td><td>${p.ok} / ${p.n}</td><td>${seg(p.t / p.n)}</td></tr>`).join("");
  const fallos = ej.map((e, k) => [e, est.res[k]]).filter(([, r]) => r.estado !== "ok");
  $("fallos").innerHTML = fallos.length ? "<h2>Para repasar</h2>" : "<p>Sin fallos hoy.</p>";
  fallos.forEach(([e, r]) => $("fallos").appendChild(tarjeta(e, r.resp)));
}

function tarjeta(e, resp) {
  const d = document.createElement("div"); d.className = "rep";
  const q = document.createElement("p"); q.className = "enun"; q.textContent = e.enunciado; d.appendChild(q);
  if (e.destacado) { const x = document.createElement("div"); x.className = "destacado"; x.textContent = e.destacado; d.appendChild(x); }
  if (e.imagen) { const w = document.createElement("div"); w.className = "img"; const im = document.createElement("img"); im.src = e.imagen; im.alt = "Ejercicio con figura desplegable"; w.appendChild(im); d.appendChild(w); }
  const r = document.createElement("p"); r.className = "resp";
  const tu = resp === undefined ? "" : resp < 0 ? " Sin respuesta." : ` Tu respuesta: ${e.imagen ? L[resp] : e.opciones[resp]}.`;
  r.innerHTML = `Respuesta: <b></b>.${tu ? " " : ""}`; r.querySelector("b").textContent = e.imagen ? L[e.correcta] : e.opciones[e.correcta];
  if (tu) r.appendChild(document.createTextNode(tu.trim()));
  d.appendChild(r);
  const t = document.createElement("p"); t.className = "truco"; t.textContent = "Truco: " + e.truco; d.appendChild(t);
  return d;
}

function repaso() {
  ver("repaso"); $("lista").innerHTML = "";
  DATOS.ejercicios.forEach(e => $("lista").appendChild(tarjeta(e)));
  window.scrollTo({ top: 0 });
}

$("empezar").onclick = empezar; $("otra").onclick = () => { ver("inicio"); window.scrollTo({ top: 0 }); };
$("repasar").onclick = repaso; $("ver").onclick = repaso;
$("volver").onclick = () => { ver(est && est.res.length === DATOS.ejercicios.length ? "resultados" : "inicio"); window.scrollTo({ top: 0 }); };
$("sig").onclick = siguiente;
document.addEventListener("keydown", ev => {
  if ($("examen").hidden || !est) return;
  const k = ev.key.toLowerCase(), idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (est.abierta && idx >= 0 && idx < DATOS.ejercicios[est.i].opciones.length) responder(idx);
  else if (!est.abierta && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); siguiente(); }
});
</script>
